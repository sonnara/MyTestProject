<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>송금하기</title>

    <style>
        body {
            margin: 0;
            background: #f5f6f8;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans KR",
                "SamsungOne",
                sans-serif;
        }

        .loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 15px;
        }

        .error {
            text-align: center;
            padding: 40px 20px;
            color: #555;
        }

        .error h2 {
            color: #222;
        }
    </style>
</head>

<body>

<div id="loading" class="loading">
    잠시만 기다려주세요...
</div>

<div id="error" class="error" style="display:none;">
    <h2>지원하지 않는 기기입니다.</h2>
    <p>
        안드로이드 또는 iPhone에서<br>
        다시 접속해주세요.
    </p>
</div>

<script>

const ua =
    navigator.userAgent ||
    navigator.vendor ||
    window.opera;


/* Android */
const isAndroid =
    /android/i.test(ua);


/* iPhone / iPad / iPod */
const isIOS =
    /iPhone|iPad|iPod/i.test(ua);


/*
 * iPadOS 13 이상에서는
 * User-Agent가 Macintosh로 나오는 경우가 있음
 */
const isIPadOS =
    navigator.platform === "MacIntel" &&
    navigator.maxTouchPoints > 1;


/* OS에 따라 페이지 이동 */

if (isAndroid) {

    window.location.replace("android.html");

}
else if (isIOS || isIPadOS) {

    window.location.replace("ios.html");

}
else {

    document.getElementById("loading").style.display =
        "none";

    document.getElementById("error").style.display =
        "block";
}

</script>

</body>
</html>
