<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>송금하기</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4f6f8;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
.wrap{max-width:480px;margin:auto;padding:22px 16px 36px}
.card{background:#fff;border-radius:22px;padding:24px 18px 26px;box-shadow:0 5px 24px rgba(0,0,0,.07)}
h1{font-size:26px;margin:0 0 7px;font-weight:800}
.sub{font-size:14px;color:#777;line-height:1.5;margin-bottom:20px}
.account{background:#f6f7f9;border-radius:15px;padding:18px;margin-bottom:12px}
.bank{font-size:14px;color:#777;margin-bottom:7px}
.number{font-size:24px;font-weight:800;letter-spacing:.3px}
.holder{font-size:14px;color:#666;margin-top:7px}
.copy{width:100%;height:56px;border:0;border-radius:14px;background:#222;color:#fff;font-size:17px;font-weight:800;margin-bottom:24px}
.copy:active,.bankBtn:active{transform:scale(.98)}
.copyText{display:none;text-align:center;color:#14823b;font-size:13px;font-weight:700;margin:-12px 0 16px}
.title{font-size:17px;font-weight:800;margin-bottom:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bankBtn{height:54px;border:1px solid #dedede;background:#fff;border-radius:13px;font-size:15px;font-weight:700;color:#333}
.status{display:none;margin-top:16px;background:#f1f6ff;color:#315a9b;border-radius:12px;padding:13px;text-align:center;font-size:13px;line-height:1.5}
.note{font-size:12px;color:#999;text-align:center;line-height:1.6;margin-top:18px}
</style>
</head>

<body>
<div class="wrap">
<div class="card">

<h1>송금하기</h1>

<div class="sub">
계좌번호를 복사하거나<br>
사용하시는 은행 앱을 선택하세요.
</div>

<div class="account">
<div class="bank">입금은행</div>
<div class="number">카카오뱅크</div>
<div class="holder">계좌번호 79421337704 · 예금주 정근원</div>
</div>

<button class="copy" onclick="copyAccount()">
계좌번호 + 은행명 복사
</button>

<div id="copyText" class="copyText">
79421337704 카카오뱅크가 복사되었습니다.
</div>

<div class="title">은행 앱으로 바로가기</div>

<div class="grid">
<button class="bankBtn" onclick="openBank('KB국민은행')">KB국민은행</button>
<button class="bankBtn" onclick="openBank('신한은행')">신한은행</button>
<button class="bankBtn" onclick="openBank('우리은행')">우리은행</button>
<button class="bankBtn" onclick="openBank('하나은행')">하나은행</button>
<button class="bankBtn" onclick="openBank('NH농협은행')">NH농협은행</button>
<button class="bankBtn" onclick="openBank('IBK기업은행')">IBK기업은행</button>
<button class="bankBtn" onclick="openBank('카카오뱅크')">카카오뱅크</button>
<button class="bankBtn" onclick="openBank('토스뱅크')">토스뱅크</button>
<button class="bankBtn" onclick="openBank('케이뱅크')">케이뱅크</button>
<button class="bankBtn" onclick="openBank('SC제일은행')">SC제일은행</button>
</div>

<div id="status" class="status"></div>

<div class="note">
은행을 누르면 먼저<br>
<b>79421337704 카카오뱅크</b>를 복사한 뒤<br>
해당 은행 앱 실행을 시도합니다.
</div>

</div>
</div>

<script>

const ACCOUNT = "79421337704";
const RECIPIENT_BANK = "카카오뱅크";
const COPY_VALUE = ACCOUNT + " " + RECIPIENT_BANK;


/*
 * iOS에서는 Android intent://를 사용하지 않습니다.
 *
 * 아래 URL은 각 은행 앱이 공개적으로 사용하는
 * 앱 실행 URL Scheme이 확인된 경우 넣어야 합니다.
 *
 * 확인되지 않은 Scheme을 임의로 호출하면
 * Safari에서 아무 동작도 하지 않을 수 있으므로,
 * 현재는 App Store fallback을 기본으로 사용합니다.
 */
const BANKS = {

"KB국민은행": {
    scheme: null,
    store: "https://apps.apple.com/kr/app/kb%EC%8A%A4%ED%83%80%EB%B1%85%ED%82%B9/id373742138"
},

"신한은행": {
    scheme: null,
    store: "https://apps.apple.com/kr/app/%EC%8A%88%ED%8D%BCsol/id572462063"
},

"우리은행": {
    scheme: null,
    store: "https://apps.apple.com/kr/app/%EC%9A%B0%EB%A6%ACwon%EB%B1%85%ED%82%B9/id1470181652"
},

"하나은행": {
    scheme: null,
    store: "https://apps.apple.com/kr/app/%ED%95%98%EB%82%98%EC%9B%90%ED%81%90/id847268987"
},

"NH농협은행": {
    scheme: null,
    store: "https://apps.apple.com/kr/app/nh%EC%8A%A4%EB%A7%88%ED%8A%B8%EB%B1%85%ED%82%B9/id738245797"
},

"IBK기업은행": {
    scheme: null,
    store: "https://apps.apple.com/kr/app/ibk-i-one-bank/id1504176251"
},

"카카오뱅크": {
    scheme: null,
    store: "https://apps.apple.com/kr/app/%EC%B9%B4%EC%B9%B4%EC%98%A4%EB%B1%85%ED%81%AC/id1258016944"
},

"토스뱅크": {
    scheme: null,
    store: "https://apps.apple.com/kr/app/%ED%86%A0%EC%8A%A4/id839333328"
},

"케이뱅크": {
    scheme: null,
    store: "https://apps.apple.com/kr/app/%EC%BC%80%EC%9D%B4%EB%B1%85%ED%81%AC/id1178914125"
},

"SC제일은행": {
    scheme: null,
    store: "https://apps.apple.com/kr/app/sc%EC%A0%9C%EC%9D%BC%EC%9D%80%ED%96%89/id486062946"
}

};


async function copyText(text) {

try {

await navigator.clipboard.writeText(text);
return true;

} catch(e) {

const textarea = document.createElement("textarea");

textarea.value = text;
textarea.style.position = "fixed";
textarea.style.left = "-9999px";

document.body.appendChild(textarea);

textarea.focus();
textarea.select();

const result = document.execCommand("copy");

textarea.remove();

return result;
}

}


async function copyAccount() {

await copyText(COPY_VALUE);

const el = document.getElementById("copyText");

el.style.display = "block";

setTimeout(() => {
el.style.display = "none";
}, 1800);

}


async function openBank(name) {

const bank = BANKS[name];

if (!bank) return;


/*
 * 1. 계좌번호 + 입금은행 복사
 */
await copyText(COPY_VALUE);


/*
 * 2. 안내
 */
const status = document.getElementById("status");

status.innerHTML =
"<b>" + name + "</b>으로 이동합니다.<br>" +
"79421337704 카카오뱅크가 복사되었습니다.";

status.style.display = "block";


/*
 * 3. 공식 iOS Scheme이 확인된 경우에만 앱 실행.
 * 현재는 안전하게 App Store 링크로 fallback.
 */
if (bank.scheme) {

const start = Date.now();

window.location.href = bank.scheme;

setTimeout(() => {

if (Date.now() - start < 1800) {
window.location.href = bank.store;
}

}, 1500);

}
else {

setTimeout(() => {
window.location.href = bank.store;
}, 500);

}

}

</script>
</body>
</html>
